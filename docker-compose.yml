services:
  pulseguard:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      StorageProvider: ${StorageProvider:-Azure}
      ConnectionStrings__PulseStore: ${ConnectionStrings__PulseStore:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFeqC6m2GZKk9uZk3YgQxJ8M7QxXQ==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RabbitMq__UserName:-pulseguard}
      RabbitMq__Password: ${RabbitMq__Password:-pulseguard}
      RabbitMq__VirtualHost: ${RabbitMq__VirtualHost:-/}
      ApplicationTelemetry__Enabled: ${ApplicationTelemetry__Enabled:-false}
      ApplicationTelemetry__FilePath: /app/logs/pulseguard-.json
    ports:
      - "8080:8080"
    depends_on:
      azurite:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - pulseguard-logs:/app/logs

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulseguard}
      POSTGRES_USER: ${POSTGRES_USER:-pulseguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseguard}
    ports:
      - "5432:5432"
    volumes:
      - pulseguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RabbitMq__UserName:-pulseguard}
      RABBITMQ_DEFAULT_PASS: ${RabbitMq__Password:-pulseguard}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - pulseguard-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - pulseguard-azurite:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:10000/devstoreaccount1?comp=list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pulseguard-logs:
  pulseguard-postgres:
  pulseguard-rabbitmq:
  pulseguard-azurite:
